<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClubEstoque - Categorias</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <ul>
      <li><i class="fas fa-arrow-down"></i><span class="label">Entradas</span></li>
      <li><i class="fas fa-arrow-up"></i><span class="label">Saídas</span></li>
      <li><i class="fas fa-box"></i><span class="label">Produtos</span></li>
      <li><i class="fas fa-tags"></i><span class="label">Categorias</span></li>
      <li><i class="fas fa-truck"></i><span class="label">Fornecedores</span></li>
      <li><i class="fas fa-users"></i><span class="label">Usuários</span></li>
      <li><i class="fas fa-chart-line"></i><span class="label">Relatórios</span></li>
    </ul>
  </div>

  <div class="main-content">
    <header>
      <!-- espaço flexível à esquerda -->
      <div class="header-left"></div>

      <!-- centro: logo + form -->
      <div class="header-center">
        <img src="logo sem fundo.png" alt="Logo AABB Londrina-PR">
        <form id="form">
          <input type="text" id="nome" placeholder="Digite o nome de uma nova categoria" required />
          <button type="submit">Salvar</button>
        </form>
      </div>

      <!-- topo direito: perfil -->
      <div class="header-right">
        <div class="user-menu">
          <i class="fas fa-user user-icon" onclick="toggleUserDropdown()"></i>
          <div class="user-dropdown" id="userDropdown">
            <a href="#">Meu Perfil</a>
            <a href="#">Sair</a>
          </div>
        </div>
      </div>
    </header>

    <div id="categorias"></div>
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const nomeInput = document.getElementById('nome');
    const categoriasDiv = document.getElementById('categorias');
    const toastContainer = document.getElementById('toastContainer');
    const API_URL = 'http://localhost:3000/api/categorias';

    function mostrarToast(mensagem, tipo = 'sucesso') {
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.textContent = mensagem;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function carregarCategorias() {
      try {
        const response = await fetch(API_URL);
        const categorias = await response.json();
        categoriasDiv.innerHTML = '';
        categorias.forEach(cat => {
          const div = document.createElement('div');
          div.className = 'categoria';
          const input = document.createElement('input');
          input.type = 'text'; input.value = cat.nome; input.disabled = true;
          const btnEditar = document.createElement('button');
          btnEditar.innerHTML = '<i class="fas fa-pen"></i>'; btnEditar.title = "Editar";
          let editando = false;
          btnEditar.onclick = async () => {
            if (!editando) {
              input.disabled = false; input.focus();
              editando = true;
              btnEditar.innerHTML = '<i class="fas fa-save"></i>'; btnEditar.title = "Salvar";
            } else {
              const novo = input.value.trim();
              if (!novo) { mostrarToast('Preencha este campo.', 'erro'); return; }
              if (/[^a-zA-Z\u00C0-\u00FF\s]/.test(novo)) {
                mostrarToast('Não pode conter números ou caracteres especiais.', 'erro');
                return;
              }
              try {
                const resp = await fetch(`${API_URL}/${cat.id}`, {
                  method:'PUT',
                  headers:{ 'Content-Type':'application/json' },
                  body: JSON.stringify({ nome: novo })
                });
                const data = await resp.json();
                if (!resp.ok && data.erro === 'Nome da categoria já existe') {
                  mostrarToast('Categoria já existente!', 'erro'); return;
                }
                if (!resp.ok) {
                  mostrarToast(data.erro || 'Erro ao atualizar!', 'erro'); return;
                }
                mostrarToast('Atualizado com sucesso!');
                carregarCategorias();
              } catch {
                mostrarToast('Erro ao atualizar!', 'erro');
              }
            }
          };
          const btnExcluir = document.createElement('button');
          btnExcluir.innerHTML = '<i class="fas fa-trash"></i>'; btnExcluir.title="Excluir";
          btnExcluir.onclick = async () => {
            try {
              await fetch(`${API_URL}/${cat.id}`, { method:'DELETE' });
              mostrarToast('Excluído com sucesso!');
              carregarCategorias();
            } catch {
              mostrarToast('Erro ao excluir!', 'erro');
            }
          };
          const botoes = document.createElement('div'); botoes.append(btnEditar, btnExcluir);
          div.append(input, botoes);
          categoriasDiv.append(div);
        });
      } catch {
        mostrarToast('Erro ao carregar!', 'erro');
      }
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const nome = nomeInput.value.trim();
      if (!nome) { mostrarToast('Preencha este campo.', 'erro'); return; }
      if (/[^a-zA-Z\u00C0-\u00FF\s]/.test(nome)) {
        mostrarToast('Não pode conter números ou caracteres especiais.', 'erro');
        return;
      }
      try {
        const resp = await fetch(API_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ nome })
        });
        const data = await resp.json();
        if (!resp.ok && data.erro === 'Nome da categoria já existe') {
          mostrarToast('Categoria já existente!', 'erro'); return;
        }
        if (!resp.ok) {
          mostrarToast(data.erro || 'Erro ao salvar!', 'erro'); return;
        }
        nomeInput.value = '';
        mostrarToast('Cadastrado com sucesso!');
        carregarCategorias();
      } catch {
        mostrarToast('Erro ao salvar!', 'erro');
      }
    });

    carregarCategorias();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('minimized');
    }
    function toggleUserDropdown() {
      const d = document.getElementById('userDropdown');
      d.style.display = d.style.display === 'block' ? 'none' : 'block';
    }
    document.addEventListener('click', e => {
      const u = document.querySelector('.user-icon');
      const d = document.getElementById('userDropdown');
      if (!u.contains(e.target) && !d.contains(e.target)) d.style.display = 'none';
    });
  </script>
</body>
</html>
